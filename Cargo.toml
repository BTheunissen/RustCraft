[package]
name = "rustcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "A hobby voxel sandbox and game engine written in Rust."
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = { version = "=0.18.2", default-features = false }
glam = "0.34.1"
png = "0.18.1"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
